[project]
name = "trm-watch"
version = "0.1.0"
description = "TRM (peso/dólar) watch for Colombia. Track the official USD/COP rate from the open datos.gov.co (Superfinanciera) API: trend, volatility, streaks, and a natural-language read."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "openai>=1.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[project.scripts]
trm-watch = "trm_watch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trm_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
